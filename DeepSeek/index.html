<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Shooter - Difesa Stellare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #03050b 0%, #0a0f1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Orbitron', monospace;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 20px;
            border-radius: 32px;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
        }

        canvas {
            display: block;
            border-radius: 20px;
            box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: none;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 3rem;
            background: #010a1ae0;
            padding: 8px 24px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            border: 1px solid #2affb6;
            font-weight: bold;
        }

        .score-box, .difficulty-box {
            color: #b3ffe0;
            text-shadow: 0 0 5px #00ffcc;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .score-box span, .difficulty-box span {
            color: #ffd966;
            font-size: 1.9rem;
            font-weight: bold;
            background: #00000070;
            padding: 0 8px;
            border-radius: 12px;
            margin-left: 10px;
        }

        button {
            background: #1f3a4b;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 6px 20px;
            border-radius: 60px;
            color: #cefff0;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px black;
            letter-spacing: 1px;
        }

        button:hover {
            background: #3fc5b0;
            color: #01080f;
            transform: scale(1.02);
            box-shadow: 0 0 12px #0ff;
        }

        .controls-tip {
            font-size: 0.8rem;
            background: #000000aa;
            padding: 6px 16px;
            border-radius: 40px;
            color: #7fcdff;
            display: flex;
            gap: 20px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 0px cyan;}
            100% { opacity: 1; text-shadow: 0 0 8px #0ff;}
        }
        .game-over-msg {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4rem;
            background: #000000bf;
            padding: 12px 28px;
            border-radius: 60px;
            border: 2px solid #ff3366;
            color: #ff5577;
            font-weight: bold;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 3px;
            animation: pulse 1.2s infinite alternate;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div class="info-panel">
            <div class="score-box">💥 PUNTEGGIO <span id="scoreValue">0</span></div>
            <div class="difficulty-box">🌀 DIFFICOLTÀ <span id="difficultyInd">0</span></div>
            <button id="restartButton">🔄 RIAVVIA</button>
        </div>
        <div class="controls-tip">
            <span>◀  ▶  → FRECCE movimento</span>
            <span>🔫 SPAZIO → SPARA</span>
        </div>
    </div>
</div>

<script>
    (function(){
        // --------------------------------------------------------------
        // 1. SEZIONE INIZIALIZZAZIONE ELEMENTI & COSTANTI
        // --------------------------------------------------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');
        const difficultySpan = document.getElementById('difficultyInd');
        const restartBtn = document.getElementById('restartButton');

        // Dimensioni canvas
        const W = 1000, H = 700;

        // ----- PARAMETRI DI GIOCO -----
        let gameActive = true;          // stato partita attiva
        let score = 0;                 // punteggio totale
        
        // --- Dinamiche tempo & difficoltà ---
        let gameTimeSeconds = 0;        // secondi trascorsi dall'ultimo restart (difficoltà crescente)
        
        // ---- SPAWN METEORITI (difficoltà progressiva) ----
        let currentSpawnDelay = 1.2;    // secondi tra uno spawn e l'altro (iniziale)
        const INIT_SPAWN_DELAY = 1.2;
        const MIN_SPAWN_DELAY = 0.32;   // spawn rapidissimo ad alta difficoltà
        let spawnAccumulator = 0;        // accumulatore per delta-time
        
        // Velocità base meteoriti (pixel/sec) + incremento dinamico
        const METEOR_BASE_SPEED = 115;    // px/s
        // fattore di incremento velocità in base al tempo: ogni secondo + 14 px/s (max +300)
        const SPEED_INCREASE_PER_SEC = 14;
        const MAX_EXTRA_SPEED = 320;
        
        // ---- Navicella ----
        let shipX = W/2;
        const shipY = H - 65;           // posizione fissa verticale (basso)
        const shipRadius = 16;           // raggio per collisioni e hitbox
        let leftPressed = false;
        let rightPressed = false;
        const SHIP_SPEED = 440;          // pixel/sec
        
        // ---- Proiettili ----
        let bullets = [];
        const BULLET_RADIUS = 4;
        const BULLET_SPEED = -530;        // verso l'alto (px/sec)
        let lastShotTime = 0;
        const SHOT_DELAY = 0.2;            // secondi tra un colpo e l'altro (5 colpi/sec)
        
        // ---- Meteoriti (nemici) ----
        let meteors = [];
        
        // ---- stelle decorative (sfondo) ----
        const stars = [];
        for(let i=0; i<280; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                radius: Math.random() * 2.2 + 1,
                alpha: Math.random() * 0.6 + 0.3
            });
        }
        
        // ----- variabili per il loop di gioco & delta time -----
        let lastTimestamp = null;
        let animationId = null;
        
        // --------------------------------------------------------------
        // 2. FUNZIONI UTILI (reset, spawn meteoriti, collisioni, aggiornamenti)
        // --------------------------------------------------------------
        
        // Calcola velocità attuale per un nuovo meteorite in base al tempo di gioco
        function getMeteorSpeed() {
            let extra = Math.min(MAX_EXTRA_SPEED, gameTimeSeconds * SPEED_INCREASE_PER_SEC);
            return METEOR_BASE_SPEED + extra;
        }
        
        // Calcola il delay di spawn attuale (difficoltà: meno delay = più nemici)
        function computeSpawnDelay() {
            let reduction = gameTimeSeconds * 0.052;
            let newDelay = INIT_SPAWN_DELAY - reduction;
            if(newDelay < MIN_SPAWN_DELAY) newDelay = MIN_SPAWN_DELAY;
            return newDelay;
        }
        
        // Aggiorna gli indicatori UI (punteggio e difficoltà visuale)
        function updateUI() {
            scoreSpan.textContent = score;
            // mostra indice difficoltà: in base al delay di spawn (più basso = più duro) e velocità nemici
            let diffPercent = Math.floor(((INIT_SPAWN_DELAY - currentSpawnDelay) / (INIT_SPAWN_DELAY - MIN_SPAWN_DELAY)) * 100);
            if(diffPercent < 0) diffPercent = 0;
            if(diffPercent > 100) diffPercent = 100;
            let speedMeter = Math.min(100, Math.floor((getMeteorSpeed() - METEOR_BASE_SPEED) / (MAX_EXTRA_SPEED) * 100));
            let difficultyLevel = Math.floor((diffPercent + speedMeter)/1.5);
            difficultySpan.textContent = `${difficultyLevel}%`;
        }
        
        // SPAWN di un nuovo meteorite (posizione casuale in alto)
        function spawnMeteor() {
            // raggio variabile tra 10 e 19 pixel (diversi per varietà)
            let radius = 12 + Math.random() * 9;
            let x = Math.random() * (W - radius * 2) + radius;
            let speedY = getMeteorSpeed();
            meteors.push({
                x: x,
                y: -radius,          // parte appena fuori dal bordo superiore
                radius: radius,
                speedY: speedY
            });
        }
        
        // RESET COMPLETO DEL GIOCO (mantiene canvas e loop)
        function fullReset() {
            gameActive = true;
            score = 0;
            gameTimeSeconds = 0;
            meteors = [];
            bullets = [];
            shipX = W/2;
            leftPressed = false;
            rightPressed = false;
            currentSpawnDelay = INIT_SPAWN_DELAY;
            spawnAccumulator = 0;
            lastShotTime = performance.now() / 1000;   // timestamp in secondi per cooldown
            
            // ripristina punteggio UI
            updateUI();
        }
        
        // Gestione collisione circolare (distanza centri)
        function checkCollision(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            const dist = Math.hypot(dx, dy);
            return dist < r1 + r2;
        }
        
        // AGGIORNAMENTO LOGICA DI GIOCO (muove oggetti, collisioni, spawn, game over)
        function updateGame(deltaSec) {
            if (!gameActive) return;  // se game over -> niente movimento o spawn
            
            // 1) incrementa timer di difficoltà (tempo di gioco)
            gameTimeSeconds += deltaSec;
            
            // 2) aggiorna spawnDelay in tempo reale in base al tempo di gioco
            currentSpawnDelay = computeSpawnDelay();
            
            // 3) movimento della navicella (solo destra/sinistra)
            let move = 0;
            if(leftPressed) move = -1;
            if(rightPressed) move = 1;
            shipX += move * SHIP_SPEED * deltaSec;
            // limiti orizzontali (rispetto ai bordi e raggio nave)
            if(shipX - shipRadius < 0) shipX = shipRadius;
            if(shipX + shipRadius > W) shipX = W - shipRadius;
            
            // 4) Aggiornamento proiettili: muovi e rimuovi quelli fuori dallo schermo
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y += bullets[i].speedY * deltaSec;
                if(bullets[i].y + BULLET_RADIUS < 0 || bullets[i].y - BULLET_RADIUS > H) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // 5) Aggiornamento meteoriti: movimento verticale e rimozione quelli fuori (basso)
            for(let i=0; i<meteors.length; i++) {
                meteors[i].y += meteors[i].speedY * deltaSec;
                if(meteors[i].y - meteors[i].radius > H + 100) {
                    meteors.splice(i,1);
                    i--;
                }
            }
            
            // 6) GESTIONE COLLISIONI: proiettili vs meteoriti (prima delle collisioni con nave)
            for(let i=0; i<bullets.length; i++) {
                let bullet = bullets[i];
                let hitIndex = -1;
                for(let j=0; j<meteors.length; j++) {
                    let meteor = meteors[j];
                    if(checkCollision(bullet.x, bullet.y, BULLET_RADIUS, meteor.x, meteor.y, meteor.radius)) {
                        hitIndex = j;
                        break;
                    }
                }
                if(hitIndex !== -1) {
                    // rimuovi meteorite e proiettile, aumenta punteggio
                    meteors.splice(hitIndex,1);
                    bullets.splice(i,1);
                    score += 10;
                    updateUI();
                    i--;  // perché array modificato
                }
            }
            
            // 7) COLLISIONE NAVE vs METEORITI (game over)
            for(let i=0; i<meteors.length; i++) {
                let meteor = meteors[i];
                if(checkCollision(shipX, shipY, shipRadius, meteor.x, meteor.y, meteor.radius)) {
                    gameActive = false;   // fine partita
                    break;                // non serve controllare ulteriori collisioni
                }
            }
            
            // 8) SPAWN DINAMICO DEI METEORITI (in base al delta e al delay corrente)
            //    più tempo passa -> spawnAccumulator più veloce e spawnDelay minore -> più meteoriti
            spawnAccumulator += deltaSec;
            while(spawnAccumulator >= currentSpawnDelay && gameActive) {
                spawnMeteor();
                spawnAccumulator -= currentSpawnDelay;
                // Opzionale: piccola possibilità extra per difficoltà estrema, a volte doppio spawn (rende più frenetico)
                if(gameTimeSeconds > 7 && Math.random() < 0.28 && currentSpawnDelay < 0.65) {
                    spawnMeteor();
                }
            }
        }
        
        // --------------------------------------------------------------
        // 3. GESTIONE INPUT (tastiera: frecce, spazio)
        // --------------------------------------------------------------
        function handleKeyDown(e) {
            if(e.key === 'ArrowLeft') {
                leftPressed = true;
                e.preventDefault();
            } else if(e.key === 'ArrowRight') {
                rightPressed = true;
                e.preventDefault();
            } else if(e.code === 'Space') {
                e.preventDefault();
                if(!gameActive) return;  // se game over non si spara
                
                const nowSec = performance.now() / 1000;
                if((nowSec - lastShotTime) >= SHOT_DELAY) {
                    // crea nuovo proiettile dalla posizione della navicella (davanti)
                    bullets.push({
                        x: shipX,
                        y: shipY - shipRadius - 2,
                        speedY: BULLET_SPEED,
                        radius: BULLET_RADIUS
                    });
                    lastShotTime = nowSec;
                }
            }
        }
        
        function handleKeyUp(e) {
            if(e.key === 'ArrowLeft') {
                leftPressed = false;
                e.preventDefault();
            } else if(e.key === 'ArrowRight') {
                rightPressed = false;
                e.preventDefault();
            } else if(e.code === 'Space') {
                e.preventDefault();
            }
        }
        
        // --------------------------------------------------------------
        // 4. DISEGNO (grafica 2D: navicella, meteoriti, proiettili, stelle, game over)
        // --------------------------------------------------------------
        function drawStars() {
            for(let s of stars) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 240, 200, ${s.alpha})`;
                ctx.fill();
            }
        }
        
        // disegna navicella spaziale (stile top-down)
        function drawShip() {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#0af";
            ctx.beginPath();
            // corpo principale (triangolo)
            ctx.moveTo(shipX, shipY - 15);
            ctx.lineTo(shipX - 14, shipY + 6);
            ctx.lineTo(shipX - 5, shipY + 2);
            ctx.lineTo(shipX - 5, shipY + 10);
            ctx.lineTo(shipX, shipY + 7);
            ctx.lineTo(shipX + 5, shipY + 10);
            ctx.lineTo(shipX + 5, shipY + 2);
            ctx.lineTo(shipX + 14, shipY + 6);
            ctx.closePath();
            ctx.fillStyle = "#3cc7ff";
            ctx.fill();
            ctx.fillStyle = "#aaffff";
            ctx.beginPath();
            ctx.arc(shipX, shipY-5, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#154a66";
            ctx.beginPath();
            ctx.arc(shipX, shipY-7, 3, 0, Math.PI*2);
            ctx.fill();
            
            // ali laterali
            ctx.beginPath();
            ctx.moveTo(shipX-16, shipY+2);
            ctx.lineTo(shipX-24, shipY+8);
            ctx.lineTo(shipX-18, shipY+5);
            ctx.fillStyle = "#2d9cdb";
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(shipX+16, shipY+2);
            ctx.lineTo(shipX+24, shipY+8);
            ctx.lineTo(shipX+18, shipY+5);
            ctx.fill();
            
            ctx.restore();
            // glow motore
            ctx.beginPath();
            ctx.rect(shipX-6, shipY+8, 12, 6);
            ctx.fillStyle = "#ff8800";
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        // disegna meteoriti (rocce spaziali)
        function drawMeteors() {
            for(let m of meteors) {
                ctx.save();
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#422800";
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI*2);
                const grad = ctx.createRadialGradient(m.x-3, m.y-3, 3, m.x, m.y, m.radius);
                grad.addColorStop(0, "#8b5a2b");
                grad.addColorStop(1, "#3e2a1f");
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.fillStyle = "#4f3a2a";
                ctx.beginPath();
                ctx.arc(m.x-2, m.y-2, m.radius*0.3, 0, Math.PI*2);
                ctx.fill();
                // crateri
                ctx.fillStyle = "#2a2418";
                for(let i=0;i<3;i++) {
                    let ang = Math.random()*Math.PI*2;
                    let offX = Math.cos(ang)*(m.radius*0.5);
                    let offY = Math.sin(ang)*(m.radius*0.5);
                    ctx.beginPath();
                    ctx.arc(m.x+offX, m.y+offY, m.radius*0.2, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }
        
        function drawBullets() {
            for(let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, BULLET_RADIUS-1, 0, Math.PI*2);
                ctx.fillStyle = "#ffff70";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(b.x, b.y, BULLET_RADIUS-2, 0, Math.PI*2);
                ctx.fillStyle = "#ffaa44";
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        
        // overlay game over + messaggio
        function drawGameOverlay() {
            if(!gameActive) {
                ctx.font = "bold 44monospace";
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ff3366dd";
                ctx.shadowColor = "#ff0066";
                ctx.fillText("⚡ GAME OVER ⚡", W/2-150, H/2-50);
                ctx.font = "24px monospace";
                ctx.fillStyle = "#cceeff";
                ctx.fillText("premi [RIAVVIA] per continuare", W/2-190, H/2+40);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#ffcc88";
                ctx.fillText("Distratti: "+score+" meteoriti", W/2-100, H/2+100);
            }
        }
        
        // sfondo dinamico con nebulosa leggera
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, "#030214");
            grad.addColorStop(1, "#10162c");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            drawStars();
            // effetto "via lattea" leggero
            ctx.fillStyle = "rgba(140, 100, 210, 0.03)";
            for(let i=0;i<80;i++) {
                ctx.beginPath();
                ctx.arc( (i*23)%W, (i*17)%H, 35, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        // funzione draw principale
        function draw() {
            drawBackground();
            drawMeteors();
            drawBullets();
            drawShip();
            drawGameOverlay();
            
            // UI extra: mostra difficoltà attuale nel canvas (velocità nemici + spawn)
            ctx.font = "bold 14px 'Courier New'";
            ctx.fillStyle = "#9effcf";
            ctx.shadowBlur = 0;
            ctx.fillText("⚡ difficulty spike: " + Math.floor(getMeteorSpeed()-METEOR_BASE_SPEED)+" +spd", 20, 40);
            ctx.fillText("⌛ spawn ogni " + currentSpawnDelay.toFixed(2)+"s", 20, 65);
        }
        
        // --------------------------------------------------------------
        // 5. GAME LOOP (delta time, update, draw, requestAnimationFrame)
        // --------------------------------------------------------------
        function gameLoop(nowMs) {
            if(!lastTimestamp) {
                lastTimestamp = nowMs;
                requestAnimationFrame(gameLoop);
                return;
            }
            
            // delta secondi (limitato max 0.033 per evitare salti esagerati)
            let delta = Math.min(0.033, (nowMs - lastTimestamp) / 1000);
            if(delta <= 0) {
                lastTimestamp = nowMs;
                requestAnimationFrame(gameLoop);
                return;
            }
            
            // Aggiornamento logica solo se il gioco è attivo oppure serve disegno static
            if(gameActive) {
                updateGame(delta);
                // dopo eventuale collisione che disattiva gameActive, non aggiorniamo più movimento extra
            }
            
            // disegno sempre (mostra frame aggiornato o schermata game over)
            draw();
            
            lastTimestamp = nowMs;
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // --------------------------------------------------------------
        // 6. INIZIALIZZAZIONE EVENTI E RESET BUTTON
        // --------------------------------------------------------------
        function initEventListeners() {
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            restartBtn.addEventListener('click', () => {
                fullReset();
                // Forziamo la rimozione di eventuali residui grafici e reset dei parametri dinamici
                // Garantiamo che il gioco riparta pulito
                gameActive = true;
                // Resetta anche ultimi timestamp per evitare delta abnorme dopo reset
                lastTimestamp = null;
                spawnAccumulator = 0;
                currentSpawnDelay = INIT_SPAWN_DELAY;
                meteors = [];
                bullets = [];
                score = 0;
                gameTimeSeconds = 0;
                shipX = W/2;
                updateUI();
                // ripristina cooldown sparo
                lastShotTime = performance.now() / 1000;
            });
        }
        
        // Evita scroll con tasti freccia anche su tutta la pagina
        window.addEventListener('keydown', function(e) {
            if(e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.code === 'Space') {
                e.preventDefault();
            }
        });
        
        // Avvia gioco
        function startGame() {
            fullReset();
            initEventListeners();
            lastTimestamp = null;
            animationId = requestAnimationFrame(gameLoop);
        }
        
        startGame();
    })();
</script>
</body>
</html>
