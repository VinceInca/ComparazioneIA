<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>
  <style>
    /* ─── RESET & BASE ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --blue: #1a8fff;
      --cyan: #0ff;
      --orange: #ff6a00;
      --dark: #050a1a;
      --panel: rgba(10,20,50,0.85);
      --border: rgba(0,200,255,0.25);
    }

    body {
      background: #020612;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
      color: #aac;
      overflow: hidden;
    }

    /* Sfondo stellato animato */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20,60,120,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(60,10,80,0.2) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── HUD ──────────────────────────────────────────────── */
    #hud {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 620px;
      max-width: 96vw;
      padding: 10px 18px;
      margin-bottom: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    #hud .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #hud .label { font-size: 10px; color: rgba(150,200,255,0.5); text-transform: uppercase; letter-spacing: 0.12em; }
    #hud .value { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 700; color: #4af; }
    #hud .value.lives { color: #ff6060; }

    /* ─── CANVAS ────────────────────────────────────────────── */
    #wrap {
      position: relative;
      z-index: 1;
    }

    #game-canvas {
      display: block;
      background: #050a1a;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(0,150,255,0.12), 0 0 2px rgba(0,200,255,0.3);
    }

    /* ─── FOOTER ────────────────────────────────────────────── */
    #footer {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      font-size: 11px;
      color: rgba(150,180,220,0.45);
      letter-spacing: 0.08em;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ─── HUD ─────────────────────────────────────────────── -->
  <div id="hud">
    <div class="stat">
      <span class="label">Punteggio</span>
      <span class="value" id="score-display">0</span>
    </div>
    <div class="stat">
      <span class="label">Record</span>
      <span class="value" id="high-display">0</span>
    </div>
    <div class="stat">
      <span class="label">Livello</span>
      <span class="value" id="level-display">1</span>
    </div>
    <div class="stat">
      <span class="label">Vite</span>
      <span class="value lives" id="lives-display">♥ ♥ ♥</span>
    </div>
  </div>

  <!-- ─── CANVAS ───────────────────────────────────────────── -->
  <div id="wrap">
    <canvas id="game-canvas" width="620" height="500"></canvas>
  </div>

  <div id="footer">← → MUOVI &nbsp;|&nbsp; SPAZIO SPARA &nbsp;|&nbsp; P PAUSA</div>

  <!-- ─── GAME SCRIPT ───────────────────────────────────────── -->
  <script>
    // ═══════════════════════════════════════════════════════════
    //  INIZIALIZZAZIONE
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('game-canvas');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById('score-display');
    const highEl  = document.getElementById('high-display');
    const levelEl = document.getElementById('level-display');
    const livesEl = document.getElementById('lives-display');

    // Stato del gioco: menu | playing | paused | gameover
    let state     = 'menu';
    let score     = 0;
    let highScore = 0;
    let level     = 1;
    let lives     = 3;
    let frame     = 0;

    // Oggetti di gioco
    const player = {
      x: W / 2, y: H - 65,
      w: 46, h: 38,
      speed: 5.5,
      iframes: 0   // frame di invincibilità dopo un colpo
    };

    let bullets   = [];
    let meteors   = [];
    let particles = [];
    let stars     = [];
    let shockwaves = [];

    // Input da tastiera
    const keys   = {};
    let lastShot = 0;

    // Parametri di difficoltà
    let spawnInterval = 85;   // frame tra uno spawn e l'altro
    let spawnTimer    = 0;
    let meteorSpeed   = 1.9;

    // Generazione stelle statiche di sfondo
    for (let i = 0; i < 140; i++) {
      stars.push({
        x:     Math.random() * W,
        y:     Math.random() * H,
        r:     Math.random() * 1.5 + 0.3,
        alpha: Math.random() * 0.7 + 0.3,
        twinkle: Math.random() * 60
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  DISEGNO — sfondo e stelle
    // ═══════════════════════════════════════════════════════════
    function drawBackground() {
      // Sfondo spazio
      ctx.fillStyle = '#050a1a';
      ctx.fillRect(0, 0, W, H);

      // Stelle con scintillio
      stars.forEach(s => {
        const t = (frame + s.twinkle) * 0.04;
        const a = s.alpha * (0.65 + 0.35 * Math.sin(t));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  DISEGNO — navicella
    // ═══════════════════════════════════════════════════════════
    function drawPlayer() {
      // Lampeggio durante invincibilità
      if (player.iframes > 0 && Math.floor(frame / 5) % 2 === 0) return;

      const x = player.x, y = player.y;
      ctx.save();

      // Glow blu
      ctx.shadowColor = '#0af';
      ctx.shadowBlur  = 18;

      // Corpo principale
      ctx.fillStyle = '#1a8fff';
      ctx.beginPath();
      ctx.moveTo(x, y - player.h / 2);                       // punta
      ctx.lineTo(x + player.w / 2, y + player.h / 2);        // ala destra
      ctx.lineTo(x + player.w * 0.15, y + player.h * 0.22);  // incisione destra
      ctx.lineTo(x - player.w * 0.15, y + player.h * 0.22);  // incisione sinistra
      ctx.lineTo(x - player.w / 2, y + player.h / 2);        // ala sinistra
      ctx.closePath();
      ctx.fill();

      // Dettaglio alare
      ctx.fillStyle = 'rgba(100,200,255,0.35)';
      ctx.beginPath();
      ctx.moveTo(x, y - player.h * 0.2);
      ctx.lineTo(x + player.w * 0.42, y + player.h * 0.45);
      ctx.lineTo(x + player.w * 0.15, y + player.h * 0.22);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y - player.h * 0.2);
      ctx.lineTo(x - player.w * 0.42, y + player.h * 0.45);
      ctx.lineTo(x - player.w * 0.15, y + player.h * 0.22);
      ctx.closePath();
      ctx.fill();

      // Cabina pilota
      ctx.shadowBlur = 0;
      const cabGrad = ctx.createRadialGradient(x - 2, y - player.h * 0.08, 1, x, y - player.h * 0.1, player.w * 0.13);
      cabGrad.addColorStop(0, '#aff');
      cabGrad.addColorStop(1, '#3af');
      ctx.fillStyle = cabGrad;
      ctx.beginPath();
      ctx.ellipse(x, y - player.h * 0.1, player.w * 0.13, player.h * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Fiamma motore (flicker)
      const flicker = Math.random() * 8 + 4;
      const fGrad = ctx.createLinearGradient(x, y + player.h * 0.22, x, y + player.h / 2 + flicker);
      fGrad.addColorStop(0, 'rgba(255,160,0,0.95)');
      fGrad.addColorStop(0.5, 'rgba(255,80,0,0.6)');
      fGrad.addColorStop(1, 'rgba(255,30,0,0)');
      ctx.fillStyle = fGrad;
      ctx.beginPath();
      ctx.moveTo(x - player.w * 0.13, y + player.h * 0.22);
      ctx.lineTo(x, y + player.h / 2 + flicker);
      ctx.lineTo(x + player.w * 0.13, y + player.h * 0.22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // ═══════════════════════════════════════════════════════════
    //  DISEGNO — proiettili
    // ═══════════════════════════════════════════════════════════
    function drawBullets() {
      bullets.forEach(b => {
        ctx.save();
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur  = 12;
        // Traccia
        const bGrad = ctx.createLinearGradient(b.x, b.y + 16, b.x, b.y - 8);
        bGrad.addColorStop(0, 'rgba(0,255,255,0)');
        bGrad.addColorStop(1, '#0ff');
        ctx.fillStyle = bGrad;
        ctx.fillRect(b.x - 2, b.y - 8, 4, 22);
        // Nucleo luminoso
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x - 1.5, b.y - 8, 3, 7);
        ctx.restore();
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  DISEGNO — meteoriti
    // ═══════════════════════════════════════════════════════════
    function drawMeteors() {
      meteors.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rot);

        // Glow caldo
        ctx.shadowColor = '#f84';
        ctx.shadowBlur  = 14;

        // Forma irregolare
        ctx.fillStyle = m.color;
        ctx.beginPath();
        m.shape.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();

        // Bordo luminoso
        ctx.strokeStyle = 'rgba(255,200,100,0.45)';
        ctx.lineWidth   = 1.5;
        ctx.stroke();

        // Texture scura al centro
        ctx.shadowBlur  = 0;
        ctx.fillStyle   = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(m.size * 0.1, m.size * 0.05, m.size * 0.28, m.size * 0.22, 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Barra HP per meteoriti grandi
        if (m.maxHp > 1) {
          const bw = m.size * 1.4;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          roundRectCtx(ctx, -bw/2, m.size + 4, bw, 5, 2);
          ctx.fill();
          ctx.fillStyle = m.hp > 1 ? '#f84' : '#fc0';
          roundRectCtx(ctx, -bw/2, m.size + 4, bw * (m.hp / m.maxHp), 5, 2);
          ctx.fill();
        }

        ctx.restore();
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  DISEGNO — particelle ed effetti
    // ═══════════════════════════════════════════════════════════
    function drawParticles() {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.06;
        p.vx *= 0.98;
        p.life--;
        const a = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
        const s = p.size * (0.4 + 0.6 * a);
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
      });
    }

    function drawShockwaves() {
      shockwaves = shockwaves.filter(sw => sw.life > 0);
      shockwaves.forEach(sw => {
        sw.r   += 4;
        sw.life--;
        const a = sw.life / sw.maxLife * 0.5;
        ctx.strokeStyle = `rgba(${sw.cr},${sw.cg},${sw.cb},${a})`;
        ctx.lineWidth   = 2;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  UTILITY DISEGNO
    // ═══════════════════════════════════════════════════════════
    function roundRectCtx(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    // ═══════════════════════════════════════════════════════════
    //  OVERLAY (menu, pausa, game over)
    // ═══════════════════════════════════════════════════════════
    function drawOverlay(title, lines, btnText) {
      // Sfondo semi-trasparente
      ctx.fillStyle = 'rgba(2,6,18,0.88)';
      ctx.fillRect(0, 0, W, H);

      // Linea decorativa superiore
      const grad = ctx.createLinearGradient(W*0.1, 0, W*0.9, 0);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.5, '#0af');
      grad.addColorStop(1, 'transparent');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.1, H / 2 - 100);
      ctx.lineTo(W * 0.9, H / 2 - 100);
      ctx.stroke();

      // Titolo
      ctx.textAlign  = 'center';
      ctx.shadowColor = '#0af';
      ctx.shadowBlur  = 20;
      ctx.font        = 'bold 38px Orbitron, monospace';
      ctx.fillStyle   = '#4cf';
      ctx.fillText(title, W / 2, H / 2 - 55);
      ctx.shadowBlur  = 0;

      // Righe testo
      ctx.font      = '14px "Share Tech Mono", monospace';
      ctx.fillStyle = 'rgba(170,200,255,0.75)';
      lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 5 + i * 26));

      // Pulsante
      const bw = 210, bh = 46;
      const bx = W / 2 - bw / 2;
      const by = H / 2 + 70;
      ctx.shadowColor = '#08f';
      ctx.shadowBlur  = 16;
      ctx.fillStyle   = '#0a4ccc';
      roundRectCtx(ctx, bx, by, bw, bh, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(80,180,255,0.6)';
      ctx.lineWidth   = 1;
      ctx.stroke();
      ctx.shadowBlur  = 0;
      ctx.fillStyle   = '#fff';
      ctx.font        = 'bold 16px Orbitron, monospace';
      ctx.fillText(btnText, W / 2, by + 30);
      ctx.textAlign   = 'left';
    }

    // ═══════════════════════════════════════════════════════════
    //  SPAWN — meteoriti
    // ═══════════════════════════════════════════════════════════
    function spawnMeteor() {
      const size = 16 + Math.random() * 24;
      // Generazione forma poligonale casuale
      const pts = [];
      const n   = 7 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2;
        const r   = size * (0.65 + Math.random() * 0.55);
        pts.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
      }
      const colors = ['#9a4218','#7c380e','#b5512a','#6a2e10','#c0623c','#8b3a1c'];
      const hp     = size > 32 ? 3 : size > 22 ? 2 : 1;

      meteors.push({
        x:        30 + Math.random() * (W - 60),
        y:        -size,
        vy:       meteorSpeed * (0.65 + Math.random() * 0.7),
        vx:       (Math.random() - 0.5) * 0.9,
        rot:      Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.045,
        shape:    pts,
        size,
        color:    colors[Math.floor(Math.random() * colors.length)],
        hp,
        maxHp:    hp
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  SPAWN — particelle esplosione
    // ═══════════════════════════════════════════════════════════
    function spawnExplosion(x, y, isHit) {
      const count = isHit ? 28 : 12;
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = isHit ? 1.5 + Math.random() * 4.5 : 0.5 + Math.random() * 2;
        particles.push({
          x, y,
          vx:      Math.cos(ang) * spd,
          vy:      Math.sin(ang) * spd - (isHit ? 2 : 0.5),
          size:    isHit ? 3 + Math.random() * 5 : 2 + Math.random() * 3,
          life:    20 + Math.random() * 30,
          maxLife: 50,
          r:       isHit ? 255           : 80,
          g:       isHit ? 100 + Math.floor(Math.random() * 80) : 200,
          b:       isHit ? 20            : 255
        });
      }
      // Onda d'urto per esplosioni vere
      if (isHit) {
        shockwaves.push({ x, y, r: 4, life: 14, maxLife: 14, cr: 255, cg: 160, cb: 50 });
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  RESET E AVVIO
    // ═══════════════════════════════════════════════════════════
    function resetGame() {
      score         = 0;
      level         = 1;
      lives         = 3;
      frame         = 0;
      spawnTimer    = 0;
      meteorSpeed   = 1.9;
      spawnInterval = 85;
      player.x      = W / 2;
      player.y      = H - 65;
      player.iframes = 0;
      bullets       = [];
      meteors       = [];
      particles     = [];
      shockwaves    = [];
      state         = 'playing';
    }

    // ═══════════════════════════════════════════════════════════
    //  AGGIORNAMENTO HUD
    // ═══════════════════════════════════════════════════════════
    function updateHUD() {
      scoreEl.textContent = score;
      highEl.textContent  = highScore;
      levelEl.textContent = level;
      const hearts        = ['♥','♥','♥'].map((h, i) => i < lives ? h : '♡').join(' ');
      livesEl.textContent = hearts;
    }

    // ═══════════════════════════════════════════════════════════
    //  LOOP DI GIOCO — update
    // ═══════════════════════════════════════════════════════════
    function update() {
      if (state !== 'playing') return;
      frame++;

      // ── Difficoltà progressiva ──────────────────────────────
      level         = 1 + Math.floor(score / 12);
      meteorSpeed   = 1.9 + (level - 1) * 0.22;
      spawnInterval = Math.max(22, 85 - (level - 1) * 7);

      // ── Movimento giocatore ─────────────────────────────────
      if ((keys['ArrowLeft']  || keys['a'] || keys['A']) && player.x - player.w / 2 > 0)
        player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x + player.w / 2 < W)
        player.x += player.speed;

      // ── Sparo ───────────────────────────────────────────────
      if ((keys[' '] || keys['z'] || keys['Z']) && frame - lastShot > 13) {
        bullets.push({ x: player.x - 8, y: player.y - player.h / 2, vy: -12 });
        bullets.push({ x: player.x + 8, y: player.y - player.h / 2, vy: -12 });
        lastShot = frame;
      }

      // ── Aggiornamento proiettili ────────────────────────────
      bullets = bullets.filter(b => b.y > -20);
      bullets.forEach(b => { b.y += b.vy; });

      // ── Spawn meteoriti ─────────────────────────────────────
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnMeteor();
        // A livelli alti, doppio spawn occasionale
        if (level >= 5 && Math.random() < 0.3) spawnMeteor();
        spawnTimer = 0;
      }

      // ── Aggiornamento meteoriti ─────────────────────────────
      meteors = meteors.filter(m => m.y < H + 80);
      meteors.forEach(m => {
        m.x   += m.vx;
        m.y   += m.vy;
        m.rot += m.rotSpeed;
        // Rimbalzo sui bordi laterali
        if (m.x < m.size || m.x > W - m.size) m.vx *= -1;
      });

      // ── iframes ─────────────────────────────────────────────
      if (player.iframes > 0) player.iframes--;

      // ═══════════════════════════════════════════════════════
      //  GESTIONE COLLISIONI
      // ═══════════════════════════════════════════════════════

      // ── Proiettile vs Meteorite ─────────────────────────────
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        let hit  = false;
        for (let mi = meteors.length - 1; mi >= 0; mi--) {
          const m  = meteors[mi];
          const dx = b.x - m.x;
          const dy = b.y - m.y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < m.size * 0.88) {
            spawnExplosion(b.x, b.y, false);
            m.hp--;
            hit = true;
            if (m.hp <= 0) {
              spawnExplosion(m.x, m.y, true);
              meteors.splice(mi, 1);
              score++;
              if (score > highScore) highScore = score;
            }
            break;
          }
        }
        if (hit) bullets.splice(bi, 1);
      }

      // ── Meteorite vs Giocatore ──────────────────────────────
      if (player.iframes === 0) {
        for (let mi = meteors.length - 1; mi >= 0; mi--) {
          const m  = meteors[mi];
          const dx = player.x - m.x;
          const dy = player.y - m.y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < m.size * 0.72 + 15) {
            spawnExplosion(player.x, player.y, true);
            meteors.splice(mi, 1);
            lives--;
            if (lives <= 0) {
              state = 'gameover';
              return;
            }
            player.iframes = 130; // ~2 secondi a 60fps
            break;
          }
        }
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  LOOP DI GIOCO — render
    // ═══════════════════════════════════════════════════════════
    function render() {
      drawBackground();

      if (state === 'menu') {
        drawOverlay('SPACE SHOOTER', [
          'Distruggi i meteoriti prima che ti colpiscano.',
          'La velocità aumenta col punteggio.',
          ''
        ], '▶  INIZIA');
        return;
      }

      if (state === 'gameover') {
        drawMeteors(); drawParticles(); drawShockwaves();
        drawOverlay('GAME OVER', [
          `Punteggio finale:  ${score}`,
          `Record personale:  ${highScore}`,
          `Livello raggiunto: ${level}`
        ], '↺  RIGIOCA');
        return;
      }

      if (state === 'paused') {
        drawMeteors(); drawBullets(); drawPlayer(); drawParticles(); drawShockwaves();
        drawOverlay('PAUSA', ['Premi P per continuare', ''], '▶  RIPRENDI');
        return;
      }

      // Stato playing
      drawShockwaves();
      drawMeteors();
      drawBullets();
      drawPlayer();
      drawParticles();
      updateHUD();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    // ═══════════════════════════════════════════════════════════
    //  GESTIONE INPUT — tastiera
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') e.preventDefault(); // evita scroll pagina

      // Pausa
      if (e.key === 'p' || e.key === 'P') {
        if (state === 'playing') state = 'paused';
        else if (state === 'paused') state = 'playing';
      }
      // Enter per avviare/riavviare
      if (e.key === 'Enter') {
        if (state === 'menu' || state === 'gameover') resetGame();
        else if (state === 'paused') state = 'playing';
      }
    });

    document.addEventListener('keyup', e => { keys[e.key] = false; });

    // ═══════════════════════════════════════════════════════════
    //  GESTIONE INPUT — mouse / click sul canvas
    // ═══════════════════════════════════════════════════════════
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const cx   = (e.clientX - rect.left) * (W / rect.width);
      const cy   = (e.clientY - rect.top)  * (H / rect.height);
      const bx   = W / 2 - 105;
      const by   = H / 2 + 70;
      if (cx > bx && cx < bx + 210 && cy > by && cy < by + 46) {
        if (state === 'menu' || state === 'gameover') resetGame();
        else if (state === 'paused') state = 'playing';
      }
    });

    // ═══════════════════════════════════════════════════════════
    //  GESTIONE INPUT — touch (mobile)
    // ═══════════════════════════════════════════════════════════
    let touchStartX = null;
    let touchFireTimer = null;

    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      if (state === 'menu' || state === 'gameover') { resetGame(); return; }
      // Tocco breve = sparo continuo
      touchFireTimer = setInterval(() => {
        if (state === 'playing') {
          bullets.push({ x: player.x - 8, y: player.y - player.h / 2, vy: -12 });
          bullets.push({ x: player.x + 8, y: player.y - player.h / 2, vy: -12 });
          lastShot = frame;
        }
      }, 200);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (touchStartX === null || state !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const dx = (e.touches[0].clientX - touchStartX) * scaleX * 0.75;
      player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx));
      touchStartX = e.touches[0].clientX;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      if (touchFireTimer) { clearInterval(touchFireTimer); touchFireTimer = null; }
    });

    // ── Avvio loop ───────────────────────────────────────────
    loop();
  </script>
</body>
</html>
