<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Meteor Defender</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        canvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-align: center;
            display: none;
            text-shadow: 0 0 15px #f00;
        }
        
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 36px;
            text-align: center;
            text-shadow: 0 0 15px #0ff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui">
        Punteggio: <span id="score">0</span><br>
        Livello: <span id="level">1</span>
    </div>
    
    <div id="startScreen">
        <h1>SPACE METEOR DEFENDER</h1>
        <p>← → Freccia sinistra/destra per muoversi</p>
        <p>SPAZIO per sparare</p>
        <p style="margin-top: 30px; font-size: 24px;">Premi SPAZIO per iniziare</p>
    </div>
    
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Punteggio: <span id="finalScore">0</span></p>
        <p style="font-size: 24px; margin-top: 20px;">Premi R per ricominciare</p>
    </div>

    <script>
        // ==================== INIZIALIZZAZIONE ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Dimensioni canvas
        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        
        // Variabili di gioco
        let score = 0;
        let level = 1;
        let gameRunning = false;
        let gameOverScreen = false;
        
        // Giocatore
        const player = {
            x: WIDTH / 2,
            y: HEIGHT - 80,
            width: 50,
            height: 40,
            speed: 6
        };
        
        // Array entità
        let bullets = [];
        let meteors = [];
        let particles = []; // per effetto esplosione
        
        // Input
        let keys = {};
        
        // Timer difficoltà
        let lastSpawn = 0;
        let spawnInterval = 800; // ms tra spawn (diminuisce con livello)
        
        // Immagine di sfondo (stelle)
        let stars = [];
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * WIDTH,
                    y: Math.random() * HEIGHT,
                    size: Math.random() * 2.5 + 0.5,
                    speed: Math.random() * 1.5 + 0.5
                });
            }
        }
        
        // ==================== CLASSI ENTITÀ ====================
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 18;
                this.speed = 12;
            }
            
            update() {
                this.y -= this.speed;
            }
            
            draw() {
                ctx.fillStyle = '#0ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0ff';
                ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }
        
        class Meteor {
            constructor(x) {
                this.x = x;
                this.y = -40;
                this.radius = Math.random() * 22 + 18;
                this.speed = Math.random() * 3.5 + 2.5 + (level * 0.6);
                this.rotation = 0;
                this.rotationSpeed = Math.random() * 0.1 - 0.05;
            }
            
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Meteorite semplice
                ctx.fillStyle = '#aaa';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Ombra / crateri
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.arc(-this.radius*0.4, -this.radius*0.3, this.radius*0.4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = Math.random() * 8 - 4;
                this.vy = Math.random() * 8 - 6;
                this.life = 35;
                this.color = `hsl(${Math.random()*40 + 10}, 100%, 60%)`;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // gravità leggera
                this.life--;
            }
            
            draw() {
                ctx.globalAlpha = this.life / 35;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 6, 6);
                ctx.globalAlpha = 1;
            }
        }
        
        // ==================== GESTIONE INPUT ====================
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            
            if (!gameRunning && !gameOverScreen && (e.key === ' ' || e.key === 'Spacebar')) {
                startGame();
            }
            
            if (gameOverScreen && (e.key.toLowerCase() === 'r')) {
                resetGame();
            }
            
            if (gameRunning && e.key === ' ') {
                shoot();
            }
        });
        
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });
        
        function shoot() {
            // Limitazione sparo (cooldown semplice)
            if (Date.now() - (bullets.length > 0 ? bullets[bullets.length-1].timestamp || 0 : 0) > 180) {
                const bullet = new Bullet(player.x, player.y - 10);
                bullet.timestamp = Date.now();
                bullets.push(bullet);
            }
        }
        
        // ==================== COLLISIONI ====================
        function checkCollision(a, b) {
            if (a instanceof Bullet && b instanceof Meteor) {
                const distX = a.x - b.x;
                const distY = a.y - b.y;
                return Math.sqrt(distX*distX + distY*distY) < b.radius + 8;
            }
            if (a instanceof Meteor && b === player) {
                const distX = a.x - b.x;
                const distY = a.y - b.y;
                return Math.sqrt(distX*distX + distY*distY) < a.radius + 25;
            }
            return false;
        }
        
        // ==================== LOOP DI GIOCO ====================
        let lastTime = 0;
        
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;
            
            if (!gameRunning) {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            // Aggiorna background
            updateBackground();
            
            // Pulisci canvas
            ctx.fillStyle = 'rgba(0, 5, 20, 0.4)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            drawStars();
            
            // Aggiorna e disegna giocatore
            updatePlayer();
            drawPlayer();
            
            // Spawn meteoriti
            if (Date.now() - lastSpawn > spawnInterval) {
                spawnMeteor();
                lastSpawn = Date.now();
            }
            
            // Aggiorna proiettili
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update();
                b.draw();
                
                if (b.y < -20) {
                    bullets.splice(i, 1);
                }
            }
            
            // Aggiorna meteoriti
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.update();
                m.draw();
                
                // Fuori schermo
                if (m.y > HEIGHT + 50) {
                    meteors.splice(i, 1);
                    continue;
                }
                
                // Collisione con giocatore
                if (checkCollision(m, player)) {
                    endGame();
                    return;
                }
                
                // Collisione con proiettili
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (checkCollision(bullets[j], m)) {
                        // Esplosione
                        createExplosion(m.x, m.y, 18);
                        
                        meteors.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10 + Math.floor(level * 2);
                        updateUI();
                        break;
                    }
                }
            }
            
            // Aggiorna particelle
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            // Aumenta difficoltà
            if (score > level * 150) {
                level++;
                spawnInterval = Math.max(180, spawnInterval - 70);
                updateUI();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed;
            }
            
            // Limiti schermo
            player.x = Math.max(30, Math.min(WIDTH - 30, player.x));
        }
        
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Navicella
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0f0';
            
            // Corpo
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-20, 20);
            ctx.lineTo(-8, 15);
            ctx.lineTo(8, 15);
            ctx.lineTo(20, 20);
            ctx.closePath();
            ctx.fill();
            
            // Finestra
            ctx.fillStyle = '#00f';
            ctx.beginPath();
            ctx.arc(0, -5, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function spawnMeteor() {
            const x = Math.random() * (WIDTH - 80) + 40;
            meteors.push(new Meteor(x));
        }
        
        function createExplosion(x, y, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        function updateBackground() {
            // Stelle si muovono lentamente
            for (let star of stars) {
                star.y += star.speed;
                if (star.y > HEIGHT) star.y = 0;
            }
        }
        
        function drawStars() {
            ctx.fillStyle = '#fff';
            for (let star of stars) {
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.globalAlpha = 1;
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
        }
        
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameRunning = true;
            lastSpawn = Date.now();
            requestAnimationFrame(gameLoop);
        }
        
        function endGame() {
            gameRunning = false;
            gameOverScreen = true;
            createExplosion(player.x, player.y, 30);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function resetGame() {
            // Reset variabili
            score = 0;
            level = 1;
            spawnInterval = 800;
            bullets = [];
            meteors = [];
            particles = [];
            player.x = WIDTH / 2;
            
            document.getElementById('gameOver').style.display = 'none';
            gameOverScreen = false;
            updateUI();
            
            startGame();
        }
        
        // ==================== AVVIO ====================
        function init() {
            initStars();
            updateUI();
            
            // Istruzioni iniziali
            ctx.fillStyle = '#112';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Disegna navicella di anteprima
            player.x = WIDTH / 2;
            player.y = HEIGHT / 2 + 50;
            drawPlayer();
            
            // Loop di attesa
            requestAnimationFrame(gameLoop);
        }
        
        window.onload = init;
    </script>
</body>
</html>
