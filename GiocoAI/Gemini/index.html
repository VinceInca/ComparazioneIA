<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Prototipo</title>
    <style>
        /* CSS: Setup estetico e area di gioco */
        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            border: 2px solid #333;
            background: linear-gradient(to bottom, #000, #111);
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 1px solid red;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">Punteggio: <span id="score">0</span></div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>Premi F5 per ricominciare</p>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        /**
         * INIZIALIZZAZIONE
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let gameActive = true;
        let frameCount = 0;

        // Parametri di difficoltà dinamica
        let enemySpawnRate = 60; // Spawn ogni 60 frame (1 secondo circa)
        let enemySpeedBase = 2;

        // Stato dei tasti
        const keys = {};

        /**
         * ENTITÀ DEL GIOCO
         */
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            w: 40,
            h: 40,
            speed: 5,
            color: '#00ffcc'
        };

        const bullets = [];
        const enemies = [];

        // Gestione Input
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Funzione per sparare
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && gameActive) {
                bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, speed: 7 });
            }
        });

        /**
         * LOGICA DI GIOCO (Update & Collisioni)
         */
        function update() {
            if (!gameActive) return;

            frameCount++;

            // Difficoltà incrementale: ogni 500 frame aumenta la velocità e la frequenza
            if (frameCount % 500 === 0) {
                enemySpeedBase += 0.5;
                if (enemySpawnRate > 15) enemySpawnRate -= 5;
            }

            // Movimento Giocatore
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;

            // Movimento Proiettili
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            // Gestione Nemici (Meteoriti)
            if (frameCount % enemySpawnRate === 0) {
                const size = Math.random() * (40 - 20) + 20;
                enemies.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    w: size,
                    h: size,
                    speed: enemySpeedBase + Math.random()
                });
            }

            enemies.forEach((en, eIdx) => {
                en.y += en.speed;

                // Collisione Meteorite - Giocatore (Game Over)
                if (en.x < player.x + player.w &&
                    en.x + en.w > player.x &&
                    en.y < player.y + player.h &&
                    en.y + en.h > player.y) {
                    endGame();
                }

                // Collisione Meteorite - Proiettile
                bullets.forEach((b, bIdx) => {
                    if (b.x < en.x + en.w &&
                        b.x + b.w > en.x &&
                        b.y < en.y + en.h &&
                        b.y + b.h > en.y) {
                        
                        // Rimuovi entrambi e aumenta punteggio
                        setTimeout(() => {
                            enemies.splice(eIdx, 1);
                            bullets.splice(bIdx, 1);
                            score += 10;
                            scoreElement.textContent = score;
                        }, 0);
                    }
                });

                // Rimuovi nemici fuori schermo
                if (en.y > canvas.height) enemies.splice(eIdx, 1);
            });
        }

        /**
         * RENDERING (Disegno su Canvas)
         */
        function draw() {
            // Pulisci canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Disegna Giocatore (forma a triangolo/navicella)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.fill();

            // Disegna Proiettili
            ctx.fillStyle = 'yellow';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Disegna Nemici
            ctx.fillStyle = '#888';
            enemies.forEach(en => {
                ctx.beginPath();
                ctx.arc(en.x + en.w/2, en.y + en.h/2, en.w/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();
            });
        }

        function endGame() {
            gameActive = false;
            gameOverScreen.style.display = 'block';
        }

        /**
         * GAME LOOP
         */
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
